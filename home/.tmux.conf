# Allows us to tmux attach using ssh/mosh and if a session doesn't exist, it
# will start it and then attach
# new-session

# Make the prefix Ctrl-a instead of Ctrl-b
# Ctrl-s will send Ctrl-a to remote tmux session (if it exists)
# So we get Ctrl-a for local, Ctrl-s for remote
unbind C-b
set -g prefix C-a
unbind C-s
bind-key -n C-s send-prefix

# General
set -g mouse on
set -g history-limit 50000
set -s escape-time 0                        # Faster key repetition
set-window-option -g aggressive-resize      # Fixes weird mosh term resizing
set-window-option -g mode-keys vi           # vimmmmm
# set-option -g pane-active-border-fg blue    # Show active pane more obviously (not working on mac?)
set-option -g default-shell /bin/zsh
set-option -g focus-events on               # nvim wants this set

# Copymode
set-option -g default-command "reattach-to-user-namespace -l zsh"
unbind-key -Tcopy-mode-vi Space
unbind-key -Tcopy-mode-vi Enter

# Use y, v and p like vim instead, with Esc to cancel
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "/usr/local/bin/reattach-to-user-namespace pbcopy" \; display-message "copied to system clipboard"
bind-key -Tcopy-mode-vi C-v send -X rectangle-toggle  # Has to be pressed after v
unbind p
bind-key p run "/usr/local/bin/reattach-to-user-namespace pbpaste | /usr/local/bin/tmux load-buffer -" \; paste-buffer

# Because p is bound to paste now
unbind b
bind b previous-window

# Moving between panes, sourced from:
# https://blog.bugsnag.com/tmux-and-vim/
# Also needs a corresponding vim plugin:
# https://github.com/christoomey/vim-tmux-navigator
is_vim="~/.tmux/check_vim.sh"
# Below is the original command, see https://github.com/christoomey/vim-tmux-navigator/issues/406 for why we need above.
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                 tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                 ($is_fzf && tmux send-keys C-j) || \
                 tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                 ($is_fzf && tmux send-keys C-k)  || \
                 tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || \
                 tmux select-pane -R"
# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l" # not working on mac?

# Resize panes
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# Absolute pane resizes
bind g resize-pane -t 1 -x 85

# Moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf  # reload

# Moving between windows
bind -n C-Q next-window
# TODO come up with vim-compatible binding
# bind -n C-p previous-window

# Reload config
bind r source-file ~/.tmux.conf

# Split windows
bind s split-window -v
bind v split-window -h

# Apperance
# set -g default-terminal "screen-256color"
# set -g status-bg colour8
# set -g status-fg colour242
set -g status-right '#h'
set -g status-left ''

# Windows
# set -g window-status-format "#[fg=colour238]#I:#W"
# set -g window-status-current-format "#[fg=colour242]#I:#W"


#!/usr/bin/env bash

# TokyoNight colors for Tmux

set -g mode-style "fg=#82aaff,bg=#3b4261"

set -g message-style "fg=#82aaff,bg=#3b4261"
set -g message-command-style "fg=#82aaff,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
# set -g pane-active-border-style "fg=#82aaff"  # not working on mac?

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#82aaff,bg=#1e2030"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1b1d2b,bg=#82aaff,bold] #S #[fg=#82aaff,bg=#1e2030,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] %Y-%m-%d  %I:%M %p #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1b1d2b,bg=#82aaff,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1b1d2b,bg=#82aaff,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#828bb8,bg=#1e2030"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-format "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#ffc777]#[bg=#1e2030]#[fg=#1e2030]#[bg=#ffc777]"
set -g @prefix_highlight_output_suffix ""
